<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a7c3f">
<title>Mon tennis</title>
<meta name="description" content="Historique de matchs, simulateur de classement FFT et carnet de conseils.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
<!-- Le ?v= force le navigateur à retélécharger la feuille de style :
     à incrémenter quand un correctif CSS doit arriver partout. -->
<link rel="stylesheet" href="css/style.css?v=108">
<script type="importmap">
{
  "imports": {
    "./js/app.js": "./js/app.js?v=108",
    "./js/carte.js": "./js/carte.js?v=108",
    "./js/classement.js": "./js/classement.js?v=108",
    "./js/clubs-connus.js": "./js/clubs-connus.js?v=108",
    "./js/config.js": "./js/config.js?v=108",
    "./js/contours.js": "./js/contours.js?v=108",
    "./js/dictee.js": "./js/dictee.js?v=108",
    "./js/forms.js": "./js/forms.js?v=108",
    "./js/france.js": "./js/france.js?v=108",
    "./js/geocodage.js": "./js/geocodage.js?v=108",
    "./js/graphes.js": "./js/graphes.js?v=108",
    "./js/import-fft.js": "./js/import-fft.js?v=108",
    "./js/materiel.js": "./js/materiel.js?v=108",
    "./js/nuage.js": "./js/nuage.js?v=108",
    "./js/reperes.js": "./js/reperes.js?v=108",
    "./js/retour.js": "./js/retour.js?v=108",
    "./js/store.js": "./js/store.js?v=108",
    "./js/terrain.js": "./js/terrain.js?v=108",
    "./js/theme.js": "./js/theme.js?v=108",
    "./js/util.js": "./js/util.js?v=108",
    "./js/views/clubs.js": "./js/views/clubs.js?v=108",
    "./js/views/coaching.js": "./js/views/coaching.js?v=108",
    "./js/views/joueurs.js": "./js/views/joueurs.js?v=108",
    "./js/views/matchs.js": "./js/views/matchs.js?v=108",
    "./js/views/materiel.js": "./js/views/materiel.js?v=108",
    "./js/views/simulateur.js": "./js/views/simulateur.js?v=108"
  }
}
</script>
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo">🎾</div>
  <div class="boot-text">Chargement…</div>
  <div id="boot-diag" class="boot-diag" hidden></div>
</div>

<div id="shell" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <!-- Le retour ne va pas « en arrière » mais à la liste dont la fiche
           est issue : on arrive parfois sur une fiche sans y venir d'une
           liste, et un vrai retour d'historique sortirait alors du site. -->
      <button id="btn-retour" class="icon-btn" hidden
              title="Revenir à la liste" aria-label="Revenir à la liste">←</button>
      <h1 id="page-title">Mes matchs</h1>
      <!-- Les répertoires — adversaires et clubs — ne sont pas des écrans
           du quotidien : on les ouvre quand on cherche quelque chose. Ils
           tiennent donc ici plutôt que dans la barre du bas, qui doit
           rester lisible au pouce. -->
      <a id="btn-joueurs" class="icon-btn" href="#/joueurs"
         title="Mes adversaires" aria-label="Adversaires">👤</a>
      <a id="btn-clubs" class="icon-btn" href="#/clubs"
         title="Mes clubs" aria-label="Clubs">🏟️</a>
      <button id="btn-theme" class="icon-btn" title="Clair, sombre ou comme l'appareil"
              aria-label="Changer le thème">🌗</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <button id="fab" class="fab" aria-label="Ajouter">+</button>

  <!-- Quatre onglets pour les écrans du quotidien. Les deux répertoires
       (adversaires, clubs) vivent dans la barre du haut.

       L'écran du court n'en occupe qu'un : le carnet qui l'accompagnait a
       été absorbé — on y note désormais d'un « + », dans une fenêtre
       flottante, sans quitter le dessin du court. -->
  <nav class="tabbar">
    <a href="#/"           data-tab="/"><span>🎾</span>Matchs</a>
    <a href="#/classement" data-tab="/classement"><span>🏅</span>Classement</a>
    <a href="#/court"      data-tab="/court"><span>🎯</span>Sur le court</a>
    <a href="#/matos"      data-tab="/matos"><span>🪪</span>Profil</a>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>

<!-- Chien de garde du démarrage : sans lui, un module qui ne se charge pas
     laisse la page bloquée sur « Chargement… » sans rien expliquer. -->
<script>
(function () {
  var diag = document.getElementById('boot-diag');
  var problemes = [];

  function montrer(genre, detail) {
    if (window.__appReady || !diag) return;
    problemes.push(detail);
    diag.hidden = false;
    diag.innerHTML =
      '<strong>Le site n\'a pas pu démarrer.</strong>' +
      '<p>' + genre + '</p>' +
      '<ul><li>Recharge la page (Ctrl+Maj+R) pour ignorer le cache.</li>' +
      '<li>Désactive un éventuel bloqueur sur ce site.</li>' +
      '<li>Essaie un autre navigateur.</li></ul>' +
      '<pre>' + problemes.join('\n').replace(/[<&]/g, function (c) {
        return c === '<' ? '&lt;' : '&amp;'; }) + '</pre>';
  }

  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      montrer('Un fichier JavaScript n\'a pas pu être téléchargé.',
              'script : ' + (e.target.src || '?'));
    } else if (e.message) {
      montrer('Une erreur JavaScript a interrompu le démarrage.',
              e.message + ' (' + (e.filename || '?') + ':' + (e.lineno || 0) + ')');
    }
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    montrer('Une opération a échoué.', String((e.reason && e.reason.message) || e.reason));
  });

  setTimeout(function () {
    montrer('Le démarrage dépasse 10 secondes sans qu\'aucun écran ne s\'affiche.',
            'délai de démarrage dépassé');
  }, 10000);
})();
</script>
<!-- Le même ?v= que la feuille de style, et pour la même raison : GitHub
     Pages sert le JavaScript avec dix minutes de cache, si bien qu'un
     correctif déployé pouvait mettre dix minutes à arriver — ou ne jamais
     arriver sur un onglet resté ouvert. Le marqueur ne porte que sur le
     module d'entrée : les modules qu'il importe gardent leur propre
     cache, et il faut le savoir avant de conclure qu'un correctif ne
     marche pas. En cas de doute, un rechargement forcé tranche. -->
<script type="module" src="js/app.js?v=43"></script>
</body>
</html>
