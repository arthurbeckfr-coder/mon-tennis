# Publie le site sur GitHub Pages à chaque push sur main.
#
# Aucun secret à configurer, et c'est délibéré : GitHub Pages s'authentifie
# avec le jeton que l'action reçoit d'office. C'est la leçon tirée du site
# santé, dont le workflow réclamait un CLOUDFLARE_API_TOKEN qui n'a jamais
# été créé — d'où des déploiements manuels à répétition. Ici, il n'y a rien
# à créer : pousser suffit.
name: Déployer le site

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

# Les trois droits exigés par Pages, et rien de plus.
permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois ; un push qui en double un autre annule le premier.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Ce carnet doit rester lisible sur un court sans réseau. Une police
      # ou un script appelé chez un tiers casserait cette promesse sans
      # qu'on s'en aperçoive : le déploiement échoue plutôt.
      - name: Vérifier que le site reste autonome
        run: |
          if grep -rnE "from ['\"]https?://|src=\"https?://|href=\"https?://[^\"]*\.(css|js)" public/; then
            echo "::error::Une ressource externe s'est glissée dans public/. Le site doit fonctionner hors ligne."
            exit 1
          fi
          echo "OK — aucune ressource externe."

      # La page contient une clé Supabase, et c'est normal : la clé publiable
      # ne donne rien sans compte, ce sont les règles de la base qui décident.
      # La clé secrète, elle, contournerait tout. On vise donc l'empreinte
      # d'une vraie clé et non le mot lui-même — sans quoi le commentaire de
      # config.js, qui met justement en garde contre elle, ferait échouer
      # chaque déploiement.
      - name: Vérifier qu'aucune clé secrète ne part dans la page
        run: |
          if grep -rnE 'sb_secret_[A-Za-z0-9_-]{10,}|sk-ant-[A-Za-z0-9_-]{12,}|SUPABASE_SERVICE_ROLE_KEY *=' public/; then
            echo "::error::Une clé secrète s'est glissée dans public/. Elle n'a rien à faire dans un site public."
            exit 1
          fi
          echo "OK — aucune clé secrète dans le bundle."

      # La carte d'imports doit couvrir tous les modules, sans quoi un
      # correctif arrive à moitié : le nouveau app.js avec l'ancien
      # terrain.js, et l'on croit que le correctif ne marche pas. Le
      # déploiement échoue plutôt que de laisser passer l'oubli.
      - name: Vérifier que la carte d'imports est complète
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const bloc = html.match(/<script type="importmap">([sS]*?)</script>/);
          if (!bloc) { console.error('::error::Aucune carte d'imports dans index.html.'); process.exit(1); }
          const carte = JSON.parse(bloc[1]);
          const mods = [];
          (function marche(d, p) {
            for (const e of fs.readdirSync('public/' + d, { withFileTypes: true })) {
              if (e.isDirectory()) marche(d + '/' + e.name, p + e.name + '/');
              else if (e.name.endsWith('.js')) mods.push(p + e.name);
            }
          })('js', 'js/');
          const absents = mods.filter(m => !carte.imports['./' + m]);
          if (absents.length) {
            console.error('::error::Modules absents de la carte d'imports : ' + absents.join(', ')
              + ' — relance « node outils/carte-imports.mjs <version> ».');
            process.exit(1);
          }
          const versions = new Set(Object.values(carte.imports).map(v => v.split('?v=')[1]));
          const entree = (html.match(/js/app.js?v=(d+)/) || [])[1];
          if (versions.size !== 1 || !versions.has(entree)) {
            console.error('::error::La carte d'imports et le module d'entrée ne portent pas la même version.');
            process.exit(1);
          }
          console.log('OK — ' + mods.length + ' modules, version ' + entree + '.');
          JS

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: publication
        uses: actions/deploy-pages@v4
